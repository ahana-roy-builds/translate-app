name: reviewed-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.13.5
      - name: Install locked backend dependencies
        run: npm --prefix backend ci --ignore-scripts
      - name: Run fast fail-closed checks
        run: make test-fast

  terraform-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - name: Validate formatting, locks, and provider schemas
        run: make infra-validate

  ios-compile-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Assert reviewed Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "26.4.1"
          xcrun simctl list runtimes | grep -F "iOS 26.4"
      - name: Install checksum-pinned XcodeGen
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip \
            --output /tmp/xcodegen-2.45.4.zip
          echo '090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  /tmp/xcodegen-2.45.4.zip' | shasum -a 256 --check
          ditto -x -k /tmp/xcodegen-2.45.4.zip /tmp/xcodegen-2.45.4
          sudo /tmp/xcodegen-2.45.4/xcodegen/install.sh
          test "$(xcodegen --version)" = "Version: 2.45.4"
      - name: Supply compile-only non-production settings
        run: |
          cp ios/Config/PrivateBeta.local.xcconfig.example ios/Config/PrivateBeta.local.xcconfig
          cp ios/Config/TestFlight.local.xcconfig.example ios/Config/TestFlight.local.xcconfig
          cp ios/Config/Release.local.xcconfig.example ios/Config/Release.local.xcconfig
          sed -i '' 's/org\.REPLACE/ci.locallingo/g; s/REPLACE1234/ABCDE12345/g; s/REPLACE\.tld/ci-locallingo.dev/g' ios/Config/PrivateBeta.local.xcconfig ios/Config/TestFlight.local.xcconfig ios/Config/Release.local.xcconfig
      - name: Run continuous conversation and Relay regressions
        run: python3 evaluation/scripts/run_talk_tests.py simulator --simulator 'platform=iOS Simulator,name=iPhone 17,OS=26.4'
      - name: Save conversation test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: talk-simulator-${{ github.run_attempt }}
          path: evaluation/results/talk/
          retention-days: 7
          if-no-files-found: ignore
      - name: Run Debug unit tests
        run: xcodebuild -project ios/LocalLingo.xcodeproj -scheme LocalLingo -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.4' test
      - name: Compile unsigned PrivateBeta configuration
        run: xcodebuild -project ios/LocalLingo.xcodeproj -scheme 'LocalLingo Private Beta' -configuration PrivateBeta -destination 'generic/platform=iOS' -derivedDataPath /tmp/locallingo-private-beta-derived CODE_SIGNING_ALLOWED=NO build
      - name: Compile unsigned TestFlight configuration
        run: xcodebuild -project ios/LocalLingo.xcodeproj -scheme LocalLingo -configuration TestFlight -destination 'generic/platform=iOS' -derivedDataPath /tmp/locallingo-testflight-derived CODE_SIGNING_ALLOWED=NO build
      - name: Compile unsigned Release configuration
        run: xcodebuild -project ios/LocalLingo.xcodeproj -scheme LocalLingo -configuration Release -destination 'generic/platform=iOS' -derivedDataPath /tmp/locallingo-release-derived CODE_SIGNING_ALLOWED=NO build
