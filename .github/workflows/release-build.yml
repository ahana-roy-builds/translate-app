name: release-build-attestation

on:
  workflow_dispatch:
    inputs:
      subject: {description: "Relative signed build-evidence JSON", required: true, type: string}
      bundle: {description: "New relative Sigstore bundle path", required: true, type: string}
      predicate_type:
        description: "Build evidence predicate"
        required: true
        type: choice
        options:
          - urn:locallingo:attestation:ios-build:v1
          - urn:locallingo:attestation:backend-provenance:v1
          - urn:locallingo:attestation:backend-sbom:v1
          - urn:locallingo:attestation:vulnerability-scan:v1
          - urn:locallingo:attestation:secret-scan:v1

permissions: {contents: read, id-token: write, attestations: write, artifact-metadata: write}

jobs:
  attest:
    environment: release-build
    runs-on: [self-hosted, linux, locallingo-release]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {persist-credentials: false, ref: "${{ github.sha }}"}
      - name: Verify pinned release helpers
        run: |
          echo 'a51a69859510b68f33af77c0eea1f06a94bc3bf2dd9945287156243661656c0b  scripts/validate-attestation-subject.py' | sha256sum -c -
          echo '924788a5f04b93e69c0b483056d5535aff64d3018634b6c09f7ac7897c8b42a8  scripts/publish-release-artifact.py' | sha256sum -c -
      - name: Validate protected subject
        id: subject
        env: {ROOT: "${{ vars.RELEASE_ARTIFACT_ROOT }}", SUBJECT: "${{ inputs.subject }}", TYPE: "${{ inputs.predicate_type }}"}
        run: |
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$ ]] || exit 2
          path="$(/usr/bin/python3 -I scripts/validate-attestation-subject.py --artifact-root "$ROOT" --subject "$SUBJECT" --predicate-type "$TYPE" --snapshot-directory "$RUNNER_TEMP" \
            --allow urn:locallingo:attestation:ios-build:v1 --allow urn:locallingo:attestation:backend-provenance:v1 \
            --allow urn:locallingo:attestation:backend-sbom:v1 --allow urn:locallingo:attestation:vulnerability-scan:v1 \
            --allow urn:locallingo:attestation:secret-scan:v1)"
          printf 'path=%s\n' "$path" >> "$GITHUB_OUTPUT"
      - name: Attest reviewed build evidence
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: "${{ steps.subject.outputs.path }}"
          predicate-type: "${{ inputs.predicate_type }}"
          predicate-path: "${{ steps.subject.outputs.path }}"
      - name: Preserve verification bundle without replacement
        env: {ROOT: "${{ vars.RELEASE_ARTIFACT_ROOT }}", BUNDLE: "${{ inputs.bundle }}", SOURCE: "${{ steps.attest.outputs.bundle-path }}"}
        run: /usr/bin/python3 -I scripts/publish-release-artifact.py --artifact-root "$ROOT" --source "$SOURCE" --destination "$BUNDLE"
